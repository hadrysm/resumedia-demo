services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resumedia
    ports:
      - '127.0.0.1:${PG_PORT:-54329}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '127.0.0.1:${MINIO_PORT:-9010}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9011}:9001'
    volumes:
      - miniodata:/data

  # Creates the bucket and makes it publicly readable, the local stand-in for enabling r2.dev access.
  minio-init:
    image: pgsty/mc:latest
    depends_on:
      - minio
    restart: 'no'
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/resumedia-media;
      mc anonymous set download local/resumedia-media;
      "

volumes:
  pgdata:
  miniodata:
